<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test page</title>
  <style>
    :root {
      --bg: #eef3f1;
      --ink: #1d2b27;
      --muted: #5b6b66;
      --ok: #2f7d5b;
      --fail: #b23a3a;
      --panel: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #16201d;
        --ink: #e4ece9;
        --muted: #9aaba5;
        --ok: #6cc79c;
        --fail: #e57b7b;
        --panel: #1f2b27;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 1.5rem;
    }
    main {
      background: var(--panel);
      border-radius: 12px;
      padding: 2rem;
      width: min(100%, 28rem);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0 0 1.5rem; }
    li {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
    }
    .ok { color: var(--ok); font-weight: 600; }
    .fail { color: var(--fail); font-weight: 600; }
    button {
      font: inherit;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 8px;
      background: var(--ok);
      color: var(--panel);
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    #count { margin-left: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>It works.</h1>
    <p>If you can read this, the page loaded.</p>
    <ul>
      <li>HTML <span class="ok">Loaded</span></li>
      <li>CSS <span class="ok">Applied</span></li>
      <li>JavaScript <span id="js" class="fail">Not running</span></li>
      <li>Loaded at <span id="time">—</span></li>
    </ul>
    <button id="btn" type="button">Click to test</button>
    <span id="count">0 clicks</span>
  </main>
  <script>
    const js = document.getElementById("js");
    js.textContent = "Running";
    js.className = "ok";
    document.getElementById("time").textContent = new Date().toLocaleTimeString();
    let n = 0;
    document.getElementById("btn").addEventListener("click", () => {
      n++;
      document.getElementById("count").textContent = n + (n === 1 ? " click" : " clicks");
    });
  </script>
</body>
</html>
